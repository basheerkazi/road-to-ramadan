<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#164E60">
<meta name="description" content="Road to Ramadan by Basheer Kazi, Growth with Purpose: a free, private daily planner for the weeks before Ramadan.">
<meta name="author" content="Basheer Kazi">
<title>Road to Ramadan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--teal:#164E60;--teal2:#1f6a80;--gold:#C9A227;--bg:#FBF7EE;--card:#fff;--ink:#1d2b30;--muted:#5f6f74;--line:#e7e0cd;--soft:#eef4f3;--on:#164E60;--onInk:#fff;--danger:#9b2c2c;--fs:16px}
[data-theme=dark]{--bg:#0f1c20;--card:#172a30;--ink:#e9efee;--muted:#9fb1b4;--line:#264048;--soft:#1d353c;--on:#C9A227;--onInk:#13262b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:linear-gradient(160deg,var(--teal),var(--teal2));color:#fff;padding:18px 16px 22px;border-radius:0 0 22px 22px}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;opacity:.9}
.hero h1{margin:10px 0 2px;font-size:1.9rem;line-height:1.1}
.hero p{margin:0;font-size:.9rem;opacity:.92}
.hero .pbar{height:8px;background:rgba(255,255,255,.22);border-radius:6px;overflow:hidden;margin-top:12px}
.hero .pbar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .6s}
.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;font-size:.78rem}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.h{font-size:1.05rem;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:.85rem}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.strip button{flex:1 0 42px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;font-size:.75rem;line-height:1.2}
.strip button b{display:block;font-size:1rem}
.strip button.sel{background:var(--on);color:var(--onInk);border-color:var(--on)}
.strip .dot{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.strip .dot.has{background:var(--gold)}
.linkbtn{background:none;border:0;color:var(--teal2);font-size:.85rem;padding:6px 0;text-decoration:underline}
[data-theme=dark] .linkbtn{color:var(--gold)}
.scorewrap{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--soft)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .5s;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font-weight:700;font-size:20px}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;transition:transform .12s,background .2s}
.tile .ic{display:block;font-size:1.3rem;line-height:1.2}
.tile.on{background:var(--on);color:var(--onInk);border-color:var(--on)}
.tile:active{transform:scale(.95)}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.habits .tile{text-align:left;padding:12px;font-size:.88rem;display:flex;gap:8px;align-items:center}
.habits .tile .ic{font-size:1.2rem}
.minute{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.minute:last-child{border-bottom:0}
.minute .lbl{flex:1;min-width:130px}
.minute .lbl small{display:block;color:var(--muted);font-size:.78rem}
.minute .val{width:62px;text-align:center;font-weight:700;font-size:1.1rem;border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;background:var(--card);color:var(--ink)}
.minute .val.hit{border-color:var(--gold);background:rgba(201,162,39,.14)}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:6px 10px;font-size:.82rem}
.chip:active{transform:scale(.94)}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.sub{margin-top:8px}
.btn{padding:11px 16px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:600}
[data-theme=dark] .btn{background:var(--gold);color:#13262b}
.btn.ghost{background:transparent;color:var(--teal2);border:1.5px solid var(--teal2)}
[data-theme=dark] .btn.ghost{color:var(--gold);border-color:var(--gold)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:7px 8px;font-size:.8rem}
.seg button.on{background:var(--on);color:var(--onInk)}
.wk{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:none;width:100%;text-align:left;font-size:.88rem}
.wk .l{width:90px}
.wk .b{flex:1;height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.wk .b i{display:block;height:100%;background:var(--gold);border-radius:6px}
.wk .s{width:46px;text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--teal2);font-weight:600}
[data-theme=dark] .tabs button.on{color:var(--gold)}
.hide{display:none!important}
.notice{background:#fff7e0;color:#5a4a12;border:1px solid #e8d9a6;border-radius:12px;padding:10px;font-size:.85rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.brand{display:inline-block;margin-top:8px;color:var(--teal2);font-size:.8rem}
[data-theme=dark] .brand{color:var(--gold)}
.foot{font-size:.78rem;color:var(--muted);text-align:center;margin:18px 8px}
.promo .tag{display:inline-block;background:var(--soft);border-radius:20px;padding:2px 10px;font-size:.72rem;margin-bottom:6px}
.ob{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:520px;margin:0 auto}
.ob h2{font-size:1.5rem;margin:0 0 6px}
.ob .dots{display:flex;gap:6px;margin-bottom:18px}
.ob .dots i{width:28px;height:5px;border-radius:3px;background:var(--line)}
.ob .dots i.on{background:var(--gold)}
.lvl{display:grid;gap:8px;margin-top:10px}
.lvl button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left}
.lvl button.on{border-color:var(--gold);background:rgba(201,162,39,.12)}
.burst{position:fixed;pointer-events:none;z-index:10;font-size:22px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.stat{margin-bottom:4px;padding:12px}
.stat b{display:block;font-size:1.5rem;color:var(--teal2)}
[data-theme=dark] .stat b{color:var(--gold)}
.stat span{font-size:.78rem;color:var(--muted)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm .hd{text-align:center;font-size:.7rem;color:var(--muted)}
.hc{aspect-ratio:1;border:0;border-radius:7px;font-size:.7rem;background:color-mix(in srgb,var(--gold) calc(var(--a)*100%),var(--soft));color:var(--ink)}
.hmk{display:flex;align-items:center;gap:4px;margin-top:8px}
.hmk i{width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--gold) calc(var(--a)*100%),var(--soft))}
@media print{.tabs,.hero,.noprint,.toast,#storeWarn,.promo,.actions{display:none!important}body{padding:0;background:#fff}.card{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hero" id="hero"></header>
  <main>
    <div id="storeWarn"></div>
    <section id="v-today"></section>
    <section id="v-progress" class="hide"></section>
    <section id="v-audit" class="hide"></section>
    <section id="v-settings" class="hide"></section>
    <p class="foot">This is a consistency tool, not a measure of your faith or worth. Missed a day? Resume at the next prayer.<br><span class="brand">By <strong>Basheer Kazi</strong> · Growth with Purpose</span></p>
  </main>
</div>
<nav class="tabs" id="tabs">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-v="audit"><svg viewBox="0 0 24 24"><path d="M9 4h6M8 2h8v4H8zM6 4H5a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1M8 12l3 3 5-5"/></svg>Audit</button>
  <button data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<div id="ob"></div>

<script>
const KEY = 'road-to-ramadan-v1';
const DEFAULT_RAMADAN = '2027-02-09';   // expected 1 Ramadan 1448 (India). Subject to moon sighting.
const AHILLA_LINK = '';                 // paste the AHILLA app link here once it is live
const PLAN_DAYS = 80;
const PHASES = ['Foundation and awareness', 'Discipline and learning', 'Character and responsibility', 'Ramadan readiness'];
const LEVEL_NAMES = ['Minimum', 'Standard', 'Stretch'];
const TARGETS = { qur: [5, 15, 30], learn: [5, 15, 25], exercise: [10, 20, 30] };
const MAX_SCORE = 14;
const PRAYERS = [['fajr', 'Fajr', '🌅'], ['dhuhr', 'Dhuhr', '☀️'], ['asr', 'Asr', '🌤️'], ['maghrib', 'Maghrib', '🌇'], ['isha', 'Isha', '🌙']];
const MINUTES = [['qur', 'Qur’an', '📖'], ['learn', 'Islamic learning', '🎧'], ['exercise', 'Movement', '🚶']];
const HABITS = [
  ['dhikr', 'Dhikr, istighfar, salawat', '📿'],
  ['character', 'One character focus', '🌱', 'charNote', 'Which weakness?'],
  ['kind', 'Kindness or service', '🤝'],
  ['family', 'Undivided family time', '🏡'],
  ['digital', 'Screen habits in check', '📵'],
  ['repair', 'Settled a pending matter', '✅', 'repairNote', 'Only if you want to note it']
];
const AUDIT_QS = [
  'Did I protect my five daily prayers?',
  'Is my relationship with the Qur’an improving?',
  'Am I becoming a calmer person?',
  'Have I hurt anyone through my speech this week?',
  'Did I fulfil my responsibilities toward my family?',
  'Was my income, conduct and dealing with people fair and honest?',
  'What have I wasted time on?',
  'What have I done purely for Allah that nobody else knows about?',
  'What have I avoided that I should have addressed?',
  'What is the one improvement I will make next week?'
];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diff = (a, b) => Math.round((b - a) / 86400000);
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmtD = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let mem = {}, storageOK = true, curKey = ymd(todayD()), view = 'today';

/* ---------- Storage ---------- */
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t'); } catch (e) { storageOK = false; }
  try { mem = JSON.parse(raw) || {}; } catch (e) { mem = {}; }
  const existing = !!mem.settings;
  mem.settings = Object.assign({ start: ymd(todayD()), ramadan: DEFAULT_RAMADAN, theme: 'auto', fs: 16 }, mem.settings || {});
  mem.settings.levels = Object.assign({ qur: 1, learn: 1, exercise: 1 }, mem.settings.levels || {});
  if (mem.settings.onboarded === undefined) mem.settings.onboarded = existing;   // earlier users skip the welcome
  mem.days = mem.days || {};
  mem.audits = mem.audits || {};
}
let saveTimer;
function save(quiet) {
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { storageOK = false; renderWarn(); return; }
  if (!quiet) { clearTimeout(saveTimer); saveTimer = setTimeout(() => toast('Saved'), 350); }
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400);
}
function renderWarn() {
  $('#storeWarn').innerHTML = storageOK ? '' : '<div class="notice">Storage is turned off in this browser, so entries will not be kept after you close the page.</div>';
}

/* ---------- Entries and score ---------- */
const blank = () => ({ pr: {}, qur: 0, dhikr: false, learn: 0, character: false, charNote: '', kind: false, family: false, exercise: 0, digital: false, repair: false, repairNote: '', notes: '' });
const getEntry = k => { const e = Object.assign(blank(), mem.days[k] || {}); e.pr = Object.assign({}, e.pr); return e; };
function score(e) {
  const L = mem.settings.levels;
  let s = PRAYERS.filter(p => e.pr[p[0]]).length;
  MINUTES.forEach(m => { if (e[m[0]] >= TARGETS[m[0]][L[m[0]]]) s++; });
  HABITS.forEach(h => { if (e[h[0]]) s++; });
  return s;
}
const hasEntry = e => PRAYERS.some(p => e.pr[p[0]]) || MINUTES.some(m => e[m[0]]) || HABITS.some(h => e[h[0]]) || e.charNote || e.repairNote || e.notes;
function putEntry(e) { mem.days[curKey] = e; save(); }

function planInfo() {
  const ram = parse(mem.settings.ramadan);
  let start = parse(mem.settings.start);
  const earliest = addDays(ram, -PLAN_DAYS);
  if (start < earliest) start = earliest;
  const total = Math.max(diff(start, ram), 1);
  const today = todayD();
  const idx = diff(start, today) + 1;
  const state = today < start ? 'before' : (today >= ram ? 'after' : 'on');
  const phase = Math.min(3, Math.floor(Math.max(idx - 1, 0) * 4 / total));
  return { start, ram, total, today, idx, state, phase, left: diff(today, ram) };
}
const moonNote = () => mem.settings.ramadan === DEFAULT_RAMADAN ? ' Subject to moon sighting, it may be 10 Feb.' : '';

/* ---------- Hero ---------- */
function renderHero() {
  const p = planInfo();
  let body;
  if (p.state === 'after') {
    body = `<h1>Ramadan has begun</h1><p>Your road is complete. Keep the habits you built.</p>`;
  } else if (p.state === 'before') {
    body = `<h1>${p.left} days to Ramadan</h1><p>Your plan starts on ${fmtD(p.start)}. Ramadan is expected on ${fmtD(p.ram)}.${moonNote()}</p>`;
  } else {
    const pct = Math.round(p.idx / p.total * 100);
    body = `<span class="pill">${PHASES[p.phase]}</span><h1>${p.left} days to Ramadan</h1>
      <p>Day ${p.idx} of ${p.total}. Ramadan is expected on ${fmtD(p.ram)}.${moonNote()}</p>
      <div class="pbar"><i style="width:${pct}%"></i></div>`;
  }
  $('#hero').innerHTML = `<div class="top"><span>Road to Ramadan · Basheer Kazi</span><span>${todayD().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</span></div>${body}`;
}

/* ---------- Today ---------- */
function ringSVG(s) {
  const r = 36, c = 2 * Math.PI * r, off = c * (1 - s / MAX_SCORE);
  return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="Consistency ${s} of ${MAX_SCORE}">
    <circle class="bgc" cx="42" cy="42" r="${r}"/><circle class="fg" id="ringFg" cx="42" cy="42" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    <text x="42" y="49" text-anchor="middle" id="ringTxt">${s}</text></svg>`;
}
function updateRing(e) {
  const s = score(e), r = 36, c = 2 * Math.PI * r;
  const fg = $('#ringFg'); if (fg) fg.setAttribute('stroke-dashoffset', (c * (1 - s / MAX_SCORE)).toFixed(1));
  const t = $('#ringTxt'); if (t) t.textContent = s;
  const m = $('#ringMsg'); if (m) m.textContent = ringMsg(s);
}
const ringMsg = s => s === 0 ? 'Start with one prayer. Small steps count.' : s < 6 ? 'Good start. Keep going.' : s < 11 ? 'Steady day. Well done.' : s < MAX_SCORE ? 'Strong day, almost full.' : 'Full day. Alhamdulillah.';

function renderToday() {
  const today = todayD(), e = getEntry(curKey), L = mem.settings.levels;
  let strip = '';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today, -i), k = ymd(d), has = mem.days[k] && hasEntry(getEntry(k));
    strip += `<button data-day="${k}" class="${k === curKey ? 'sel' : ''}">${d.toLocaleDateString('en-GB', { weekday: 'short' })}<b>${d.getDate()}</b><span class="dot ${has ? 'has' : ''}"></span></button>`;
  }
  const isToday = curKey === ymd(today);
  const prayers = PRAYERS.map(([k, n, ic]) => `<button class="tile ${e.pr[k] ? 'on' : ''}" data-pr="${k}" aria-pressed="${!!e.pr[k]}"><span class="ic">${ic}</span>${n}</button>`).join('');
  const minutes = MINUTES.map(([k, n, ic]) => {
    const t = TARGETS[k][L[k]];
    return `<div class="minute"><span class="lbl">${ic} ${n}<small>Target ${t} min</small></span>
      <input class="val ${e[k] >= t ? 'hit' : ''}" type="number" inputmode="numeric" min="0" data-min="${k}" value="${e[k] || ''}" placeholder="0" aria-label="${n} minutes">
      <button class="chip" data-add="${k}" data-n="5">+5</button><button class="chip" data-add="${k}" data-n="15">+15</button></div>`;
  }).join('');
  const habits = HABITS.map(([k, n, ic]) => `<button class="tile ${e[k] ? 'on' : ''}" data-hb="${k}" aria-pressed="${!!e[k]}"><span class="ic">${ic}</span>${n}</button>`).join('');
  const notes = HABITS.filter(h => h[3]).map(([k, n, , nk, ph]) => `<input type="text" class="sub ${e[k] ? '' : 'hide'}" id="note-${nk}" data-txt="${nk}" placeholder="${n}: ${ph}" value="${esc(e[nk])}">`).join('');
  $('#v-today').innerHTML = `
    <div class="card">
      <div class="strip">${strip}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="muted">${isToday ? 'Today' : fmtD(parse(curKey))}</span>
        <button class="linkbtn" id="pickBtn">Older day</button>
      </div>
      <input type="date" id="pick" class="hide" value="${curKey}" max="${ymd(today)}">
    </div>

function reportRange() {
  const p = planInfo(), today = todayD();
  let from = p.start;
  const keys = Object.keys(mem.days).filter(k => hasEntry(getEntry(k))).sort();
  if (keys.length && parse(keys[0]) < from) from = parse(keys[0]);
  if (diff(from, today) > PLAN_DAYS) from = addDays(today, -PLAN_DAYS);
  if (from > today) from = addDays(today, -6);
  const days = [];
  for (let d = from; d <= today; d = addDays(d, 1)) days.push(d);
  return days;
}
function trendSVG(days) {
  const W = 320, H = 150, L = 28, B = 22, T = 8, last = days.slice(-14);
  const series = [['qur', 'Qur’an', 'var(--teal2)'], ['learn', 'Learning', 'var(--gold)'], ['exercise', 'Movement', '#c0674f']];
  let max = 10;
  last.forEach(d => { const e = getEntry(ymd(d)); series.forEach(s => { max = Math.max(max, e[s[0]] || 0); }); });
  max = Math.ceil(max / 10) * 10;
  const x = i => L + (last.length < 2 ? 0 : i * (W - L - 6) / (last.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  [0, max / 2, max].forEach(v => { g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`; });
  last.forEach((d, i) => { if (i % 3 === 0 || i === last.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.getDate()}</text>`; });
  const lines = series.map(([k, n, c]) => {
    const pts = last.map((d, i) => `${x(i).toFixed(1)},${y(getEntry(ymd(d))[k] || 0).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  const legend = series.map(([k, n, c]) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:14px;height:3px;border-radius:2px;background:${c}"></i>${n}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutes per day, last ${last.length} days">${g}${lines}</svg><div class="muted">${legend}</div>`;
}
function heatmap(days) {
  const first = days[0], lead = first.getDay();

  days.forEach(d => {
    const k = ymd(d), e = getEntry(k), n = PRAYERS.filter(p => e.pr[p[0]]).length;
    cells += `<button data-open="${k}" class="hc" style="--a:${n / 5}" title="${fmtD(d)}: ${n} of 5 prayers" aria-label="${fmtD(d)}, ${n} of 5 prayers">${d.getDate()}</button>`;
  });
  return cells + '</div><div class="muted hmk">Fewer <i style="--a:0"></i><i style="--a:.4"></i><i style="--a:.8"></i><i style="--a:1"></i> All 5 prayers</div>';
}
function habitStrength(days) {
  const logged = days.map(d => getEntry(ymd(d))).filter(hasEntry), L = mem.settings.levels;
  if (!logged.length) return '<p class="muted">Log a few days to see which habits are strongest.</p>';
  const items = [
    ...PRAYERS.map(([k, n, ic]) => [ic + ' ' + n, e => e.pr[k]]),
    ...MINUTES.map(([k, n, ic]) => [ic + ' ' + n, e => e[k] >= TARGETS[k][L[k]]]),
    ...HABITS.map(([k, n, ic]) => [ic + ' ' + n, e => e[k]])
  ].map(([n, f]) => [n, Math.round(logged.filter(f).length / logged.length * 100)]).sort((a, b) => b[1] - a[1]);
  const row = ([n, v], tag) => `<div class="wk" style="cursor:default"><span class="l" style="width:150px">${n}</span><span class="b"><i style="width:${v}%"></i></span><span class="s">${v}%</span></div>${tag ? `<div class="muted" style="margin:-4px 0 4px">${tag}</div>` : ''}`;
  return items.map((it, i) => row(it, i === 0 ? 'Your strongest habit. Well done.' : (i === items.length - 1 && it[1] < 100 ? 'Room to grow. Try a small step here this week.' : ''))).join('')
    + `<p class="muted">Share of the ${logged.length} days you logged.</p>`;
}
function phaseReport() {
  const p = planInfo(), per = p.total / 4;
  return PHASES.map((name, i) => {
    const s = addDays(p.start, Math.round(i * per)), e = addDays(p.start, Math.round((i + 1) * per) - 1);
    let tot = 0, n = 0;
    for (let d = s; d <= e && d <= p.today; d = addDays(d, 1)) { const en = getEntry(ymd(d)); if (hasEntry(en)) { tot += score(en); n++; } }
    const status = s > p.today ? 'Not started' : (n ? `Average ${(tot / n).toFixed(1)} of ${MAX_SCORE}, ${n} days logged` : 'No days logged yet');
    const pct = n ? Math.round(tot / n / MAX_SCORE * 100) : 0;
    return `<div style="padding:6px 0"><div style="display:flex;justify-content:space-between"><strong style="font-size:.9rem">${i + 1}. ${name}</strong></div>
      <div class="wk" style="padding:4px 0;cursor:default"><span class="b"><i style="width:${pct}%"></i></span></div><div class="muted">${fmtD(s)} to ${fmtD(e)}. ${status}</div></div>`;
  }).join('');

function runs(days) {
  let best = 0, cur = 0;
  days.forEach(d => { if (hasEntry(getEntry(ymd(d)))) { cur++; best = Math.max(best, cur); } else cur = 0; });
  // current run: forgive today if not logged yet
  let now = 0;
  for (let i = days.length - 1; i >= 0; i--) { if (hasEntry(getEntry(ymd(days[i])))) now++; else if (i === days.length - 1) continue; else break; }
  return { best, now };
}
function weekStats() {
  const today = todayD();
  let total = 0, logged = 0, qur = 0, learn = 0, ex = 0, pr = 0;
  const bars = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today, -i), e = getEntry(ymd(d)), s = score(e);

    bars.push([d, s]);

}
function renderProgress() {

const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function installMsg() {
  if (isStandalone()) return 'Installed. You are using the app version.';
  if (deferredInstall) return 'Add it to your home screen or desktop. It opens like an app and works offline.';
  if (/iphone|ipad/i.test(navigator.userAgent)) return 'On iPhone: tap the Share button in Safari, then “Add to Home Screen”.';
  return 'In Chrome or Edge, open the browser menu and choose “Install app” or “Add to Home screen”.';
}
function saveFile(text, name, type) {
  const blob = new Blob([text], { type }), file = new File([blob], name, { type });
  const fallback = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('File saved'); };
  try { if (navigator.canShare && navigator.canShare({ files: [file] }) && /android|iphone|ipad/i.test(navigator.userAgent)) { navigator.share({ files: [file], title: name }).catch(e => { if (e.name !== 'AbortError') fallback(); }); return; } } catch (e) {}
  fallback();
}
function restoreBackup(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !d.days || !d.settings) { $('#bkMsg').textContent = 'That file is not a Road to Ramadan backup.'; return; }
    const n = Object.keys(d.days).length;
    if (!confirm(`Restore ${n} days from this backup? It replaces what is on this device now.`)) return;
    mem = d; save(true); load(); applyLook(); renderHero(); renderSettings(); toast(`Restored ${n} days`);
  };
  r.readAsText(f);
}
function buildICS(t) {
  const [hh, mm] = t.split(':'), st = todayD(), until = mem.settings.ramadan.replace(/-/g, '');
  const dt = ymd(st).replace(/-/g, '') + 'T' + hh + mm + '00';
  const url = location.protocol.startsWith('http') ? location.href.split('#')[0] : 'https://basheerkazi.github.io/road-to-ramadan/';
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Road to Ramadan//EN', 'BEGIN:VEVENT', 'UID:rtr-daily-' + Date.now() + '@road-to-ramadan',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART:' + dt, 'DURATION:PT10M',
    'RRULE:FREQ=DAILY;UNTIL=' + until + 'T235959', 'SUMMARY:Road to Ramadan check-in', 'DESCRIPTION:Two minutes to log today. ' + url, 'URL:' + url,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Road to Ramadan check-in', 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'settings') renderSettings(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Installed'); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }

function onSettingsClick(ev) {
  const b = ev.target.closest('.seg button'); if (!b) return;
  const name = b.parentNode.dataset.seg, v = b.dataset.val;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  if (name.startsWith('lvl-')) mem.settings.levels[name.slice(4)] = Number(v);
  else if (name === 'theme') { mem.settings.theme = v; applyLook(); }
  else if (name === 'fs') { mem.settings.fs = Number(v); applyLook(); }
  save();
}
function onSettingsChange(ev) {
  const t = ev.target;
  if (t.dataset.set && t.value) { mem.settings[t.dataset.set] = t.value; save(); renderHero(); }
}
function applyLook() {
  const s = mem.settings;
  const dark = s.theme === 'dark' || (s.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.setProperty('--fs', s.fs + 'px');
}

function copyText(text, box) {
  const fallback = () => { box.classList.remove('hide'); box.value = text; box.focus(); box.select(); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
}

/* ---------- Welcome (first run) ---------- */
let obStep = 0, obData = {};
function openOnboarding() {
  obStep = 0;
  obData = { ramadan: mem.settings.ramadan, start: mem.settings.start, level: mem.settings.levels.qur };
  renderOb();
}
function renderOb() {
  const dots = [0, 1, 2].map(i => `<i class="${i <= obStep ? 'on' : ''}"></i>`).join('');
  let body;
  if (obStep === 0) {
    body = `<h2>Assalamu alaikum 🌙</h2>
      <p class="muted" style="margin:0 0 10px">By Basheer Kazi · Growth with Purpose</p>
      <p class="muted">Road to Ramadan helps you build steady habits before Ramadan, a little each day. Everything stays on this phone.</p>
      <p style="margin-top:16px"><strong>When does Ramadan start for you?</strong></p>
      <input type="date" id="obRam" value="${obData.ramadan}">
      <p class="muted">Expected 9 Feb 2027 in India, subject to moon sighting. You can change it later.</p>`;
  } else if (obStep === 1) {
    body = `<h2>When do you start?</h2>
      <p class="muted">Today is fine. The plan is at most ${PLAN_DAYS} days, counted back from Ramadan.</p>
      <input type="date" id="obStart" value="${obData.start}">`;
  } else {
    body = `<h2>Pick your pace</h2><p class="muted">Daily minutes for Qur’an, learning and movement. Change it any time.</p>
      <div class="lvl" id="obLvl">${LEVEL_NAMES.map((n, i) => `<button data-l="${i}" class="${obData.level === i ? 'on' : ''}"><strong>${n}</strong><br><span class="muted">Qur’an ${TARGETS.qur[i]} · Learning ${TARGETS.learn[i]} · Movement ${TARGETS.exercise[i]} min</span></button>`).join('')}</div>`;
  }
  $('#ob').innerHTML = `<div class="ob"><div class="dots">${dots}</div>${body}
    <div class="actions" style="margin-top:22px">${obStep > 0 ? '<button class="btn ghost" id="obBack">Back</button>' : ''}
    <button class="btn" id="obNext" style="flex:1">${obStep < 2 ? 'Next' : 'Start my road'}</button></div></div>`;
  $('#obNext').onclick = obNext;
  if ($('#obBack')) $('#obBack').onclick = () => { obCollect(); obStep--; renderOb(); };
  if ($('#obLvl')) $('#obLvl').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; obData.level = Number(b.dataset.l); renderOb(); };
}
function obCollect() {
  if ($('#obRam') && $('#obRam').value) obData.ramadan = $('#obRam').value;
  if ($('#obStart') && $('#obStart').value) obData.start = $('#obStart').value;
}
function obNext() {
  obCollect();
  if (obStep < 2) { obStep++; renderOb(); return; }
  const s = mem.settings;
  s.ramadan = obData.ramadan; s.start = obData.start;
  s.levels = { qur: obData.level, learn: obData.level, exercise: obData.level };
  s.onboarded = true; save(true);
  $('#ob').innerHTML = '';
  renderHero(); show(view);
  toast('Bismillah. Your road starts now.');
}

/* ---------- Navigation ---------- */
const R = { today: renderToday, progress: renderProgress, audit: renderAudit, settings: renderSettings };
function show(v) {
  view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  Object.keys(R).forEach(k => $('#v-' + k).classList.toggle('hide', k !== v));
  R[v](); window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) show(b.dataset.v); });
$('#v-today').addEventListener('click', onTodayClick);
$('#v-today').addEventListener('input', onTodayInput);
$('#v-today').addEventListener('change', onTodayChange);
$('#v-progress').addEventListener('click', onProgressClick);
$('#v-audit').addEventListener('input', onAuditInput);
$('#v-settings').addEventListener('click', onSettingsClick);
$('#v-settings').addEventListener('change', onSettingsChange);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyLook);

load(); applyLook(); renderWarn(); renderHero(); show('today');
if (!mem.settings.onboarded) openOnboarding();
</script>
</body>
</html>
